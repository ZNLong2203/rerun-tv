name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests (core, pipeline, server)
        run: npm test
      - name: Typecheck (core, pipeline, server, phone)
        run: npm run typecheck
      - name: Build the phone companion
        run: npm run build -w @rerun/phone

  tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/tv/package-lock.json
      - run: npm ci
      - name: Typecheck the Fire TV app (React Native for Vega)
        run: npm run typecheck
